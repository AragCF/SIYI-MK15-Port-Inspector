name: Windows APK build

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "runs/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Windows PowerShell 5.1 script syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path "tools" -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host ("PowerShell parse errors in " + $_.FullName)
              $errors | Format-List
              $failed = $true
            }
          }
          if ($failed) { throw "PowerShell syntax validation failed" }

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 34
        shell: pwsh
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.3.11579264"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: SIYI protocol self-test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".host-test-build" | Out-Null
          javac -encoding UTF-8 -d ".host-test-build" "app/src/main/java/com/mk15/portinspector/SiyiProtocol.java" "app/src/main/java/com/mk15/portinspector/ProbeDiffEngine.java" "app/src/main/java/com/mk15/portinspector/ReportTools.java" "app/src/main/java/com/mk15/portinspector/ChannelActivityTracker.java" "host-tests/ProtocolSelfTest.java" "host-tests/ProbeDiffSelfTest.java" "host-tests/ReportToolsSelfTest.java" "host-tests/ChannelActivityTrackerSelfTest.java"
          java -cp ".host-test-build" ProtocolSelfTest
          java -cp ".host-test-build" ProbeDiffSelfTest
          java -cp ".host-test-build" ReportToolsSelfTest
          java -cp ".host-test-build" ChannelActivityTrackerSelfTest

      - name: Build debug APK
        shell: pwsh
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "out" | Out-Null
          Copy-Item "app/build/outputs/apk/debug/app-debug.apk" "out/MK15PortInspector-1.4.0-debug.apk"
          Get-FileHash -Algorithm SHA256 "out/MK15PortInspector-1.4.0-debug.apk" | Format-List | Out-File "out/SHA256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MK15PortInspector-1.4.0-debug
          path: |
            out/MK15PortInspector-1.4.0-debug.apk
            out/SHA256.txt
          if-no-files-found: error
