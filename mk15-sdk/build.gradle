plugins {
    id 'com.android.library'
}

android {
    namespace 'com.mk15.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 23
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [rootProject.file('.native-sdk-jniLibs')]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
